<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300F0FF'><path d='M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.9 17.55 11 21 11 21z'/></svg>">
  <title>Vídeo Catálogo — EL VECINO</title>
  
  <!-- Tipografías de Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Iconos de Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Hojas de Estilos con Variables CSS y Componentes Modulares -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./components/navbar/navbar.css">
  <link rel="stylesheet" href="./components/footer/footer.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body style="background: var(--deep-obsidian); color: var(--pure-white);">

  <!-- Barra de Navegación Global Modular -->
  <div id="navbar-mount"></div>

  <!-- ==========================================================================
       CABECERA DE PÁGINA (HERO DARK)
       ========================================================================== -->
  <section class="hero-dark">
    <div class="container">
      <div class="hero-content">
        <span class="badge badge-neon-cyan">Formato Inmersivo &amp; Pruebas Reales</span>
        <h1 class="hero-title">
          Vídeo Catálogo &amp; <span class="text-neon-magenta">Demostraciones</span>
        </h1>
        <p class="hero-lead">
          Mira el funcionamiento real, desempaquetados de lotes y pruebas térmicas de cada equipo antes de solicitar tu cotización.
        </p>
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       VÍDEO GRID (TIKTOK / REELS SHOWCASE)
       ========================================================================== -->
  <section class="section-padding" style="background: var(--deep-obsidian);">
    <div class="container">
      <div class="section-header">
        <span class="section-badge badge badge-neon-magenta">En Vivo desde Bodega</span>
        <h2 class="section-title section-title-light">Videos Destacados de la Semana</h2>
      </div>

      <!-- Grid de Vídeos Estilo TikTok -->
      <div class="tiktok-grid" id="tiktokGrid">
        <!-- Renderizado desde js/app.js -->
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       FOOTER MODULAR
       ========================================================================== -->
  <div id="footer-mount"></div>

  <!-- Modal y Dock Flotante -->
  <div id="productModal" class="modal-backdrop">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeProductModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="floatingDock" class="floating-dock"></div>

  <!-- Scripts -->
  <script src="./js/config.js"></script>
  <script src="./js/data.js"></script>
  <script src="./components/navbar/navbar.js"></script>
  <script src="./components/footer/footer.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
