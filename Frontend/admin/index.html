<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Comercializadora El Vecino</title>

  <!-- Fuentes de Google: Outfit y Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols / Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS Script + Extend Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-obsidian': '#0B0F17',
            'sidebar-surface': '#0F172A',
            'border-dark': '#1E293B',
            'electric-blue': '#0800FF',
            'neon-magenta': '#FF00A8',
            'whatsapp-green': '#25D366',
            'canvas-light': '#F1F5F9'
          },
          fontFamily: {
            'outfit': ['Outfit', 'sans-serif'],
            'jakarta': ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-canvas-light text-slate-900 font-jakarta antialiased min-h-screen flex flex-col">

  <div class="min-h-screen bg-canvas-light text-slate-900 flex">
    
    <!-- SIDEBAR: Stitch Dark Slate Theme -->
    <aside class="w-64 bg-deep-obsidian border-r border-border-dark flex flex-col justify-between shrink-0 min-h-screen sticky top-0 h-screen overflow-y-auto">
      <div>
        <!-- Brand Header -->
        <div class="p-5 border-b border-border-dark flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-electric-blue rounded-xl flex items-center justify-center text-white font-outfit font-bold text-lg shadow-lg shadow-electric-blue/30">
              EV
            </div>
            <div>
              <h1 class="font-outfit font-bold text-white text-base leading-none tracking-tight">EL VECINO</h1>
            </div>
          </div>
        </div>

        <!-- Live Sync Status Chip -->
        <!-- <div class="mx-4 my-4 p-2.5 bg-sidebar-surface border border-border-dark rounded-xl flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-whatsapp-green opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-whatsapp-green"></span>
            </span>
            <span class="text-xs font-semibold text-slate-200">S</span>
          </div>
          <span class="text-[10px] font-mono text-whatsapp-green bg-whatsapp-green/20 font-bold px-1.5 py-0.5 rounded">99.98%</span>
        </div> -->

        <!-- Navigation Links -->
        <nav class="px-3 space-y-1">
          <a href="#/dashboard" data-path="/dashboard" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold rounded-xl text-white bg-electric-blue border border-electric-blue/40 shadow-md shadow-electric-blue/20 transition-all">
            <span class="material-symbols-outlined text-lg">dashboard</span>
            Resumen General
          </a>

          <a href="#/productos" data-path="/productos" class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-white hover:bg-sidebar-surface transition-all">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-lg">add</span>
              Productos
            </div>
            <span class="text-xs font-mono bg-border-dark text-slate-300 px-1.5 py-0.5 rounded-md">142</span>
          </a>

          <a href="#/whatsapp" data-path="/whatsapp" class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-white hover:bg-sidebar-surface transition-all">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-lg text-whatsapp-green">chat</span>
              Métricas de WhatsApp
            </div>
            <span class="text-xs font-mono bg-whatsapp-green/20 text-whatsapp-green px-1.5 py-0.5 rounded-md font-bold">+18</span>
          </a>

          <a href="#/demos" data-path="/demos" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-white hover:bg-sidebar-surface transition-all">
            <span class="material-symbols-outlined text-lg text-neon-magenta">play_circle</span>
            Vitrina de Redes Sociales
          </a>

          <a href="#/promos" data-path="/promos" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-white hover:bg-sidebar-surface transition-all">
            <span class="material-symbols-outlined text-lg">campaign</span>
            Promociones 
          </a>

          <a href="#/b2b" data-path="/b2b" class="flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-xl text-slate-400 hover:text-white hover:bg-sidebar-surface transition-all">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-lg">domain</span>
              Armadores de Combos
            </div>
            <span class="text-[10px] bg-electric-blue/30 text-blue-400 font-bold px-1.5 py-0.5 rounded">PRO</span>
          </a>
        </nav>
      </div>

      <!-- Sidebar Footer -->
      <div class="p-4 border-t border-border-dark">
        <div class="flex items-center gap-2 text-xs text-slate-400 font-mono">
          <span class="material-symbols-outlined text-sm text-slate-500">lock</span>
          Comercializadora El Vecino
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA: Light Slate Canvas -->
    <div class="flex-1 flex flex-col min-w-0 bg-canvas-light">
      
      <!-- HEADER TOP BAR -->
      <header class="px-6 flex items-center justify-end sticky top-0 z-10 shadow-sm">
        <!-- Área limpia: Se eliminaron buscador, status de leads y botón de nuevo producto -->
      </header>

      <!-- SUBHEADER / BREADCRUMB & ACCIONES GENERALES -->
      <div class="bg-white/60 border-b border-slate-200 px-6 py-3 flex items-center justify-between backdrop-blur-sm">
        <div>
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">COMERCIALIZADORA EL VECINO</span>
          <h2 class="text-xl font-bold font-outfit text-slate-900 leading-tight">Panel principal de Administración</h2>
        </div>

        <!-- Controles de Fecha y Botones de Acción Global -->
        <div class="flex items-center gap-2">
          <div class="bg-slate-200/70 border border-slate-300/60 rounded-xl p-1 flex items-center text-xs font-semibold">
            <button class="px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900">Hoy</button>
            <button class="px-3 py-1 rounded-lg bg-black text-white shadow-sm">Últimos 7 Días</button>
            <button class="px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900">Mes Actual</button>
            <button class="px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900">Personalizado</button>
          </div>
          
          <!-- Reporte B2B reubicado al nivel operativo -->
          <button class="flex items-center gap-1 px-3 py-1.5 bg-neon-magenta text-white rounded-xl text-xs font-bold shadow-sm shadow-neon-magenta/20 hover:opacity-90 transition">
            <span class="material-symbols-outlined text-sm">assignment_return</span>
            Reporte Combos
          </button>

          <button class="flex items-center gap-1 px-3 py-1.5 bg-black text-white rounded-xl text-xs font-bold shadow-sm hover:bg-slate-800 transition">
            <span class="material-symbols-outlined text-sm">picture_as_pdf</span>
            Reporte PDF
          </button>

          <button class="flex items-center gap-1 px-3 py-1.5 bg-neon-magenta text-white rounded-xl text-xs font-bold shadow-sm shadow-neon-magenta/20 hover:opacity-90 transition">
            <span class="material-symbols-outlined text-sm">add_circle</span>
            Nueva Campaña
          </button>
        </div>
      </div>

      <!-- DYNAMIC ROUTER VIEW CONTAINER -->
      <main id="app-content" class="p-6 flex-1 overflow-y-auto">
        <!-- Inyección dinámica con Router.js -->
      </main>

    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
