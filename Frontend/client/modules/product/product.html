<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo General — Comercializadora EL VECINO</title>
  <meta name="description" content="Explora el catálogo completo de electrodomésticos de alta gama, pantallas 4K y gaming directo de bodega sin intermediarios.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-obsidian': '#0A0A0A',
            'electric-blue': '#0800FF',
            'neon-magenta': '#FF00A8',
            'neon-cyan': '#00F0FF',
            'slate-surface': '#F4F6FB',
            'slate-border': '#E2E6EE'
          }
        }
      }
    };
  </script>

  <!-- Global & Component Styles -->
  <link rel="stylesheet" href="../../../index.css">
  <link rel="stylesheet" href="../../../components/navbar/navbar.css">
  <link rel="stylesheet" href="../../../components/footer/footer.css">
  <link rel="stylesheet" href="../../../components/cart-modal/cart-modal.css">
  <link rel="stylesheet" href="../../../components/toast/toast.css">
  <link rel="stylesheet" href="../../../components/product/product-card.css">
  <link rel="stylesheet" href="../../../components/product/product-modal.css">
  <link rel="stylesheet" href="./product.css">
</head>
<body class="bg-[#FCF8F8] font-['Plus_Jakarta_Sans'] text-[#1C1B1B] antialiased">
  <!-- Navbar Mount Target -->
  <div id="navbar-mount"></div>

  <!-- Main Catalog Content -->
  <main class="catalog-page">
    <!-- Hero Header Strip -->
    <section class="catalog-hero">
      <div class="catalog-hero-container">
        <!-- Breadcrumb & Notice -->

        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
          <div class="max-w-2xl">
            <h1 class="font-['Outfit'] font-extrabold text-3xl md:text-4xl text-deep-obsidian tracking-tight">
              Explora Nuestro Catálogo
            </h1>
            <p class="text-sm md:text-base text-gray-600 mt-2">
              Descubre especificaciones técnicas, fotografias y cotiza al instante por WhatsApp sin intermediarios.
            </p>
          </div>
        </div>

        <!-- Search Box -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 pt-4 border-t border-slate-border">
          <div class="relative flex-1 max-w-xl">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
            <input
              type="text"
              id="catalogSearchInput"
              class="w-full h-11 pl-10 pr-4 bg-white rounded-xl border border-slate-border text-sm outline-none focus:border-electric-blue focus:ring-2 focus:ring-blue-100 transition-all"
              placeholder="Busca productos"
            >
          </div>
        </div>
      </div>
    </section>

    <!-- Main Layout: Filters Aside + Product Grid -->
    <section class="catalog-layout">
      <!-- Filter Sidebar (Desktop) -->
      <aside class="catalog-filters-aside">
        <div class="flex items-center justify-between pb-3 border-b border-slate-border">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-electric-blue text-[20px]">tune</span>
            <h2 class="font-['Outfit'] font-bold text-sm uppercase text-deep-obsidian">Filtros Activos</h2>
          </div>
          <button id="btnResetFilters" class="text-xs font-bold text-neon-magenta hover:underline" type="button">
            Limpiar Todo
          </button>
        </div>

        <!-- 1. Categorías -->
        <div class="filter-group">
          <div class="filter-section-title">
            <span>Categorías</span>
            <span class="material-symbols-outlined text-[16px] text-gray-400">grid_view</span>
          </div>
          <div class="filter-options-list" id="sidebarCategoryList">
            <!-- Generado dinámicamente por product.js -->
          </div>
        </div>

        <!-- 2. Subcategorías -->
        <div class="filter-group">
          <div class="filter-section-title">
            <span>Subcategorías</span>
            <span class="material-symbols-outlined text-[16px] text-gray-400">label</span>
          </div>
          <div class="filter-options-list" id="sidebarSubcategoryList">
            <!-- Generado dinámicamente por product.js -->
          </div>
        </div>

        <!-- 3. Marcas -->
        <div class="filter-group">
          <div class="filter-section-title">
            <span>Marcas</span>
            <span class="material-symbols-outlined text-[16px] text-gray-400">verified</span>
          </div>
          <div class="filter-options-list" id="sidebarBrandList">
            <!-- Generado dinámicamente por product.js -->
          </div>
        </div>

        <!-- Disponibilidad -->
        <div class="pt-3 border-t border-slate-border">
          <div class="filter-section-title">
            <span>Disponibilidad</span>
            <span class="material-symbols-outlined text-[16px] text-gray-400">inventory_2</span>
          </div>
          <label class="filter-checkbox-label">
            <input type="checkbox" id="filterInStock" class="rounded accent-electric-blue">
            <span>Disponibilidad Inmediata</span>
          </label>
          <label class="filter-checkbox-label">
            <input type="checkbox" id="filterFeatured" class="rounded accent-electric-blue">
            <span>Líneas Destacadas</span>
          </label>
        </div>
      </aside>

      <!-- Right Column: Toolbar + Product Grid -->
      <div class="flex flex-col gap-6">
        <!-- Mobile Filters Strip (Visible en móvil antes de productos) -->
        <div class="mobile-filters-bar" id="mobileFiltersBar">
          <div class="mobile-filter-col">
            <label for="mobileCategorySelect" class="mobile-filter-label">
              <span class="material-symbols-outlined text-[14px]">grid_view</span>
              <span>Categoría</span>
            </label>
            <select id="mobileCategorySelect" class="mobile-filter-select">
              <option value="all">Todas las Categorías</option>
            </select>
          </div>

          <div class="mobile-filter-col">
            <label for="mobileSubcategorySelect" class="mobile-filter-label">
              <span class="material-symbols-outlined text-[14px]">label</span>
              <span>Subcategoría</span>
            </label>
            <select id="mobileSubcategorySelect" class="mobile-filter-select">
              <option value="all">Todas las Subcategorías</option>
            </select>
          </div>

          <div class="mobile-filter-col">
            <label for="mobileBrandSelect" class="mobile-filter-label">
              <span class="material-symbols-outlined text-[14px]">verified</span>
              <span>Marca</span>
            </label>
            <select id="mobileBrandSelect" class="mobile-filter-select">
              <option value="all">Todas las Marcas</option>
            </select>
          </div>
        </div>
        <!-- Results Toolbar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-border">
          <div class="text-sm font-semibold text-deep-obsidian" id="resultsCount">
            Cargando productos...
          </div>

          <div class="flex items-center gap-3">
            <label for="catalogSortSelect" class="text-xs text-gray-500 uppercase font-bold shrink-0">Ordenar por:</label>
            <select id="catalogSortSelect" class="bg-slate-surface text-xs font-bold text-deep-obsidian h-9 px-3 rounded-lg border border-slate-border outline-none focus:border-electric-blue">
              <option value="default">Relevancia de Bodega</option>
              <option value="popular">Más Cotizados</option>
              <option value="price-asc">Precio: Menor a Mayor</option>
              <option value="price-desc">Precio: Mayor a Menor</option>
            </select>
          </div>
        </div>

        <!-- Products Container -->
        <div class="catalog-grid" id="productsContainer">
          <!-- Dynamic Products injected by product.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Mount Target -->
  <div id="footer-mount"></div>

  <!-- Core Scripts -->
  <script src="../../../js/config.js"></script>
  <script src="../../../js/data.js"></script>
  <script src="../../../js/storage.js"></script>
  <script type="module" src="../../../js/api.js"></script>
  <script src="../../../js/service/auth.service.js"></script>
  <script src="../../../js/service/order.service.js"></script>
  <script src="../../../js/service/product.service.js"></script>
  <script src="./product.api.js"></script>
  <script src="../../../components/toast/toast.js"></script>
  <script src="../../../components/navbar/navbar.js"></script>
  <script src="../../../components/footer/footer.js"></script>
  <script src="../../../components/cart-modal/cart-modal.js"></script>
  <script src="../../../components/product/product-card.js"></script>
  <script src="../../../components/product/product-modal.js"></script>
  <script src="../../../js/main.js"></script>
  <script src="./product.js"></script>
</body>
</html>
