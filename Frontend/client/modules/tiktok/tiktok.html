<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Video Showcase — Comercializadora EL VECINO</title>
  <meta name="description" content="Descubre unboxings, pruebas de rendimiento a 120Hz y demostraciones en video de nuestros electrodomésticos y tecnología.">

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-obsidian': '#0A0A0A',
            'electric-blue': '#0800FF',
            'neon-magenta': '#FF00A8',
            'whatsapp-green': '#25D366',
            'slate-surface': '#F4F6FB',
            'slate-border': '#E2E6EE'
          }
        }
      }
    };
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../../index.css">
  <link rel="stylesheet" href="../../../components/navbar/navbar.css">
  <link rel="stylesheet" href="../../../components/footer/footer.css">
  <link rel="stylesheet" href="../../../components/cart-modal/cart-modal.css">
  <link rel="stylesheet" href="../../../components/toast/toast.css">
  <link rel="stylesheet" href="./tiktok.css">
</head>
<body class="bg-[#FCF8F8] font-['Plus_Jakarta_Sans'] text-[#1C1B1B] antialiased">
  <div id="navbar-mount"></div>

  <main class="pt-20">
    <!-- Hero Section -->
    <section class="tiktok-hero">
      <div class="tiktok-glow"></div>
      <div class="max-w-[80rem] mx-auto px-6 relative z-10 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neon-magenta/20 text-neon-magenta text-xs font-bold uppercase tracking-widest mb-4">
          <span class="material-symbols-outlined text-[18px]">play_circle</span>
          <span>Social Commerce • Demostraciones en Video</span>
        </div>
        <h1 class="font-['Outfit'] font-extrabold text-3xl md:text-5xl text-white tracking-tight leading-tight max-w-3xl mx-auto">
          Catálogo Dinámico TikTok &amp; Reels
        </h1>
        <p class="text-sm md:text-base text-gray-300 mt-3 max-w-xl mx-auto leading-relaxed">
          Mira el funcionamiento real de los equipos en bodega antes de comprar. Pruebas de imagen, sonido y capacidad con enlace directo a cotización personalizada.
        </p>
      </div>
    </section>

    <!-- Reels Grid -->
    <section class="max-w-[80rem] mx-auto px-6 py-12 pb-24">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto" id="tiktokGrid">
        <!-- Rendered dynamically by tiktok.js -->
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="../../../js/config.js"></script>
  <script src="../../../js/storage.js"></script>
  <script src="../../../js/api.js"></script>
  <script src="../../../js/service/auth.service.js"></script>
  <script src="../../../js/service/order.service.js"></script>
  <script src="./tiktok.api.js"></script>
  <script src="../../../components/toast/toast.js"></script>
  <script src="../../../components/navbar/navbar.js"></script>
  <script src="../../../components/footer/footer.js"></script>
  <script src="../../../components/cart-modal/cart-modal.js"></script>
  <script src="../../../js/main.js"></script>
  <script src="./tiktok.js"></script>
</body>
</html>
